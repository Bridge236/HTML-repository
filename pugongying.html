<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒲公英 · 同学地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-50: #eff8ed;
    --green-100: #d4edd1;
    --green-400: #6abf5c;
    --green-600: #3a8f2e;
    --green-800: #255c1d;
    --white-soft: #fafcfa;
    --gray-50: #f5f5f3;
    --gray-200: #e0dfdb;
    --gray-400: #a09e97;
    --gray-600: #5e5d58;
    --gray-800: #2c2c2a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--white-soft); color: var(--gray-800);
    height: 100vh; overflow: hidden;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- Header ---- */
  .header {
    background: #fff; border-bottom: 1px solid var(--gray-200);
    padding: 12px 24px; display: flex; align-items: center; gap: 14px;
    flex-shrink: 0; z-index: 10;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--green-100); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo svg { width: 26px; height: 26px; }
  .brand-info { display: flex; flex-direction: column; gap: 1px; }
  .brand-name { font-size: 16px; font-weight: 600; color: var(--green-800); letter-spacing: 0.5px; }
  .brand-slogan { font-size: 12px; color: var(--gray-400); letter-spacing: 0.3px; }

  /* ---- Main ---- */
  .main { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 360px; flex-shrink: 0; background: #fff;
    border-right: 1px solid var(--gray-200); display: flex; flex-direction: column;
    overflow: hidden; min-height: 0;
  }
  .sb-form { padding: 16px 20px; border-bottom: 1px solid var(--gray-50); flex-shrink: 0; }
  .sb-form h2 { font-size: 13px; font-weight: 600; color: var(--gray-800); margin-bottom: 10px; }
  .form-row { display: flex; flex-direction: column; gap: 8px; }
  .form-row input {
    width: 100%; height: 38px; border: 1px solid var(--gray-200); border-radius: 8px;
    padding: 0 12px; font-size: 13px; color: var(--gray-800); background: var(--white-soft);
    outline: none; transition: border-color 0.15s;
  }
  .form-row input:focus { border-color: var(--green-400); background: #fff; }
  .form-row input::placeholder { color: #c0bdb6; }

  .btn-row { display: flex; gap: 8px; }
  .btn {
    height: 38px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background 0.15s; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: scale(0.98); }
  .btn-add {
    flex: 1; background: var(--green-600); color: #fff;
  }
  .btn-add:hover { background: var(--green-800); }
  .btn-batch {
    width: 90px; background: var(--gray-50); color: var(--gray-600); border: 1px solid var(--gray-200);
    font-size: 12px;
  }
  .btn-batch:hover { background: var(--gray-200); }
  .btn-batch.active { background: var(--green-50); border-color: var(--green-400); color: var(--green-800); }

  .batch-area {
    display: none; margin-top: 10px; flex-direction: column; gap: 8px;
  }
  .batch-area.show { display: flex; }
  .batch-area textarea {
    width: 100%; height: 130px; border: 1px solid var(--gray-200); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; font-family: inherit; color: var(--gray-800);
    background: var(--white-soft); outline: none; resize: vertical; line-height: 1.6;
  }
  .batch-area textarea:focus { border-color: var(--green-400); background: #fff; }
  .batch-hint { font-size: 11px; color: var(--gray-400); line-height: 1.5; }
  .btn-import {
    width: 100%; height: 36px; background: var(--green-50); color: var(--green-800);
    border: 1px solid var(--green-100); border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer; letter-spacing: 0.5px;
  }
  .btn-import:hover { background: var(--green-100); }
  .btn-import:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---- List ---- */
  .sb-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 16px; }
  .sb-list-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    position: sticky; top: 0; background: #fff; padding: 4px 0; z-index: 2;
  }
  .sb-list-header .title { font-size: 13px; font-weight: 600; color: var(--gray-800); }
  .sb-list-header .count { font-size: 12px; color: var(--gray-400); }
  .sb-list-header .btn-clear {
    font-size: 11px; color: #d94a4a; background: none; border: none; cursor: pointer;
    padding: 2px 6px; border-radius: 4px;
  }
  .sb-list-header .btn-clear:hover { background: #fce4e4; }

  .student-card {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-radius: 8px; cursor: pointer; transition: background 0.12s; margin-bottom: 3px;
  }
  .student-card:hover { background: var(--green-50); }
  .student-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
    background: #e8f4e5; color: #3a7d2c;
  }
  .student-info { flex: 1; min-width: 0; }
  .student-name { font-size: 14px; font-weight: 600; color: var(--gray-800); }
  .student-school { font-size: 11px; color: var(--green-600); }
  .student-province { font-size: 10px; color: var(--gray-400); }
  .btn-del {
    width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent;
    color: var(--gray-400); cursor: pointer; font-size: 16px; line-height: 1;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .btn-del:hover { background: #fce4e4; color: #d94a4a; }
  .empty-hint { text-align: center; padding: 40px 20px; color: var(--gray-400); font-size: 13px; line-height: 1.8; }

  /* ---- Map ---- */
  .map-wrap { flex: 1; min-height: 0; position: relative; }
  #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

  /* 头像标记：去掉 Leaflet 默认图标样式 */
  .avatar-marker {
    background: none !important;
    border: none !important;
  }
  .avatar-marker div {
    transition: transform 0.15s;
  }
  .avatar-marker:hover div {
    transform: scale(1.18);
  }

  /* 省份名称标签 */
  .province-label {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    font-size: 14px;
    font-weight: 700;
    color: rgba(0,0,0,0.60);
    white-space: nowrap;
    padding: 0 !important;
    pointer-events: none;
    text-align: center;
    line-height: 16px;
    text-shadow: 0 0 4px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1);
    -webkit-text-stroke: 0.3px rgba(255,255,255,0.8);
  }
  .leaflet-tooltip.province-label::before { display: none !important; }

  /* ---- 全屏按钮 ---- */
  .btn-fullscreen {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    width: 34px; height: 34px; border: none; border-radius: 6px;
    background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.16);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--gray-600); transition: background 0.12s, color 0.12s;
  }
  .btn-fullscreen:hover { background: var(--green-50); color: var(--green-800); }
  .btn-fullscreen svg { width: 18px; height: 18px; }

  /* ---- 南海副图 ---- */
  #scs-inset {
    position: absolute; bottom: 48px; right: 10px; z-index: 999;
    width: 120px; background: #fff;
    border: 1px solid var(--gray-200); border-radius: 6px;
    overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.12);
  }
  #scs-map { width: 120px; height: 110px; }
  .scs-label {
    text-align: center; font-size: 10px; color: var(--gray-400);
    padding: 3px 0; background: var(--gray-50);
    border-top: 1px solid var(--gray-200); letter-spacing: 0.5px;
  }

  /* 全屏模式下隐藏侧栏 */
  body.is-fullscreen .sidebar { display: none; }
  body.is-fullscreen .header { display: none; }
  body.is-fullscreen .map-wrap { width: 100vw; height: 100vh; }

  /* ---- Map Legend ---- */
  .map-legend {
    position: absolute; bottom: 20px; left: 10px; z-index: 999;
    background: #fff; border-radius: 8px; padding: 8px 12px;
    border: 1px solid var(--gray-200); font-size: 11px; color: var(--gray-600);
    pointer-events: none;
  }

  /* ---- Popup ---- */
  .leaflet-popup-content-wrapper {
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.13);
    padding: 0 !important; overflow: hidden;
  }
  .leaflet-popup-content { margin: 0 !important; }
  .popup-inner { min-width: 160px; }

  /* 单人弹窗 */
  .popup-single { padding: 18px 22px; text-align: center; }
  .popup-single-avatar {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
  }
  .popup-single-name { font-size: 17px; font-weight: 700; color: var(--gray-800); margin-bottom: 5px; }
  .popup-single-school { font-size: 14px; color: var(--green-600); font-weight: 500; margin-bottom: 8px; }
  .popup-single-province {
    display: inline-block; font-size: 12px; color: var(--gray-600, #6a6a65);
    background: var(--gray-50); border: 1px solid var(--gray-200);
    border-radius: 10px; padding: 3px 10px;
  }

  /* 多人弹窗 */
  .popup-group-header {
    background: var(--gray-50); padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--gray-200);
  }
  .popup-group-province { font-size: 15px; font-weight: 700; color: var(--gray-800); }
  .popup-group-count {
    font-size: 12px; color: var(--gray-600);
    background: var(--green-100); color: var(--green-800);
    padding: 3px 9px; border-radius: 10px; font-weight: 600;
  }
  .popup-group-list { padding: 4px; }
  .popup-student-row {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px;
    border-radius: 7px; transition: background 0.1s;
  }
  .popup-student-row:hover { background: var(--green-50); }
  .popup-mini-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .popup-student-detail { flex: 1; min-width: 0; }
  .popup-name-sm { font-size: 15px; font-weight: 600; color: var(--gray-800); display: block; }
  .popup-school-sm { font-size: 13px; color: var(--green-600); display: block; }

  /* ---- Toasts ---- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--gray-800); color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; z-index: 9999; opacity: 0; pointer-events: none;
    transition: opacity 0.3s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ---- Selected Student Card ---- */
  .student-card.selected {
    background: var(--green-50);
    border-left: 3px solid var(--green-600);
    padding-left: 9px;
  }
  .student-card.selected .student-name { color: var(--green-800); font-weight: 700; }

  /* ---- Admin Mode Bar ---- */
  .admin-bar {
    display: none; position: relative; z-index: 10000;
    background: #fffbeb; border-bottom: 2px solid #f59e0b;
    padding: 7px 20px; font-size: 12px; color: #92400e;
    align-items: center; gap: 10px; flex-shrink: 0;
  }
  .admin-bar.show { display: flex; }
  .admin-bar-text { flex: 1; }
  .btn-exit-admin {
    height: 26px; padding: 0 12px;
    border: 1px solid #f59e0b; border-radius: 6px;
    background: #fff; color: #92400e;
    font-size: 12px; cursor: pointer; font-weight: 500; white-space: nowrap;
  }
  .btn-exit-admin:hover { background: #fef3c7; }

  /* Admin coord inputs */
  .admin-coord-row {
    display: flex; gap: 4px; margin-top: 5px; align-items: center; flex-wrap: wrap;
  }
  .admin-coord-label { font-size: 10px; color: var(--gray-400); }
  .admin-coord-input {
    width: 88px; height: 22px; border: 1px solid var(--gray-200);
    border-radius: 4px; padding: 0 5px; font-size: 11px;
    color: var(--gray-800); background: var(--white-soft); outline: none;
  }
  .admin-coord-input:focus { border-color: #f59e0b; }

  /* Admin map hint */
  .admin-map-hint {
    display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 999; background: #fffbeb; border: 1px solid #f59e0b;
    border-radius: 20px; padding: 5px 16px; font-size: 12px; color: #92400e;
    pointer-events: none; white-space: nowrap;
  }
  body.admin-mode .admin-map-hint { display: block; }

  /* Logo clickable in admin mode trigger */
  .logo { cursor: pointer; user-select: none; }

  /* ---- Responsive ---- */
  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; max-height: 44%; border-right: none; border-bottom: 1px solid var(--gray-200); }
    .map-wrap { flex: 1; min-height: 300px; }
  }
</style>
</head>
<body>

<!-- 管理员模式顶栏（连续点击 Logo 5 次进入） -->
<div id="adminBar" class="admin-bar">
  <span>🔧</span>
  <span class="admin-bar-text">管理员模式 &nbsp;·&nbsp; 点击地图任意位置可复制坐标 &nbsp;·&nbsp; 名录下方可编辑成员坐标</span>
  <button class="btn-exit-admin" onclick="exitAdminMode()">退出管理员模式</button>
</div>

<div class="app">

  <!-- ========== Header ========== -->
  <div class="header">
    <div class="logo" id="logoBtn">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="12" r="6" fill="#6abf5c" opacity="0.5"/>
        <circle cx="20" cy="12" r="3" fill="#6abf5c"/>
        <line x1="20" y1="18" x2="20" y2="30" stroke="#3a8f2e" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M12 20 Q10 14 14 10" stroke="#6abf5c" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M28 20 Q30 14 26 10" stroke="#6abf5c" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M16 22 L20 30" stroke="#6abf5c" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.5"/>
        <path d="M24 22 L20 30" stroke="#6abf5c" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.5"/>
        <circle cx="14" cy="9" r="1" fill="#3a8f2e" opacity="0.4"/>
        <circle cx="27" cy="9" r="1" fill="#3a8f2e" opacity="0.4"/>
        <circle cx="18" cy="7" r="0.8" fill="#3a8f2e" opacity="0.3"/>
      </svg>
    </div>
    <div class="brand-info">
      <span class="brand-name">蒲公英</span>
      <span class="brand-slogan">看看蒲公英的种子都飞到了哪！</span>
    </div>
  </div>

  <!-- ========== Main ========== -->
  <div class="main">

    <!-- ---- Sidebar ---- -->
    <div class="sidebar">
      <div class="sb-form">
        <h2>添加好友</h2>
        <div class="batch-area show" id="batchArea">
          <textarea id="batchText" placeholder="每行一个人名，用 空格/Tab/逗号 分隔&#10;格式：姓名 备注 省份&#10;&#10;"></textarea>
          <!-- <span class="batch-hint">支持：姓名 Tab 学校 Tab 省份 / 姓名,学校,省份 / 姓名 学校 省份</span> -->
          <button class="btn-import" id="btnImport">批量播种</button>
        </div>
      </div>

      <div class="sb-list" id="studentList">
        <div class="sb-list-header">
          <span class="title">好友名录</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="count" id="stuCount">0 人</span>
            <button class="btn-clear" id="btnClearAll" style="display:none">清空</button>
          </div>
        </div>
        <div class="empty-hint" id="emptyHint">
          还没有录入好友<br>在上方添加第一个好友吧
        </div>
      </div>
    </div>

    <!-- ---- Map ---- -->
    <div class="map-wrap">
      <div id="map"></div>
      <!-- 管理员模式：点击地图提示 -->
      <div class="admin-map-hint">🔧 管理员模式 · 点击地图获取坐标</div>
      <!-- 全屏按钮 -->
      <button class="btn-fullscreen" id="btnFullscreen" title="全屏">
        <svg id="fsIcon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/>
        </svg>
      </button>
      <!-- 南海诸岛副图 -->
      <div id="scs-inset">
        <div id="scs-map"></div>
        <div class="scs-label">南海诸岛</div>
      </div>
      <div class="map-legend" id="mapLegend" style="display:none">
        已标记 <strong id="legendCount">0</strong> 个省份
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  "宁夏": "宁夏", "宁夏回族自治区": "宁夏",
  "新疆": "新疆", "新疆维吾尔自治区": "新疆",
  "港澳": "香港", "香港特区": "香港", "澳门特区": "澳门"
};

// 根据输入解析省份标准名
function resolveProvince(input) {
  var p = input.trim();
  if (PROVINCE_COORDS[p]) return p;
  if (PROVINCE_ALIAS[p]) return PROVINCE_ALIAS[p];
  // 尝试模糊匹配
  for (var k in PROVINCE_COORDS) {
    if (k.includes(p) || p.includes(k)) return k;
  }
  for (var k in PROVINCE_ALIAS) {
    if (k.includes(p) || p.includes(k)) return PROVINCE_ALIAS[k];
  }
  return null;
}

// GeoJSON省份全名 → 短名（与 PROVINCE_COORDS 的 key 对应）
function getProvinceShortName(fullName) {
  var nameMap = {
    "北京市":"北京","天津市":"天津","上海市":"上海","重庆市":"重庆",
    "河北省":"河北","山西省":"山西","辽宁省":"辽宁","吉林省":"吉林",
    "黑龙江省":"黑龙江","江苏省":"江苏","浙江省":"浙江","安徽省":"安徽",
    "福建省":"福建","江西省":"江西","山东省":"山东","河南省":"河南",
    "湖北省":"湖北","湖南省":"湖南","广东省":"广东","海南省":"海南",
    "四川省":"四川","贵州省":"贵州","云南省":"云南","陕西省":"陕西",
    "甘肃省":"甘肃","青海省":"青海","台湾省":"台湾",
    "内蒙古自治区":"内蒙古","广西壮族自治区":"广西","西藏自治区":"西藏",
    "宁夏回族自治区":"宁夏","新疆维吾尔自治区":"新疆",
    "香港特别行政区":"香港","澳门特别行政区":"澳门"

  return nameMap[fullName] || fullName;

  '#c8dff0','#d0ecd6','#fdecc8','#dcd0f0','#c4dce8',
  '#f0d8c8','#d4eed8','#e8d0f0','#d0e8d8','#f0d8d8',
  '#c8d8e8','#e8e4c8','#d4c8e0','#c8d8d4','#f0e8d0',
  '#d0e0f0','#e8d0d8','#d8e8c8','#e0d0f0','#d0c8d8',
  '#d8f0d8','#f0e0c8','#d0d8e8','#e8d8c0','#e0d8f0',
  '#d0d4c8','#e0c8d0','#c8d8e0','#e8d8d0'

// ---- Helpers ----
function $(id) { return document.getElementById(id); }
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(students)); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function getInitial(n) {
  if (!n) return "?";
  if (n.length <= 2) return n;
  return n.slice(-2);
}

// 飞书风格软配色方案 — 8 种柔和色调，贴合绿色主题
var AVATAR_PALETTE = [
  { bg: "#e8f4e5", text: "#3a7d2c" },  // 淡绿
  { bg: "#e3eef9", text: "#3b6da8" },  // 淡蓝
  { bg: "#fce9ec", text: "#b54a5a" },  // 淡粉
  { bg: "#fef1dc", text: "#c07a2c" },  // 淡橙
  { bg: "#f0e6f6", text: "#7b4fa0" },  // 淡紫
  { bg: "#def0ee", text: "#3e7d75" },  // 淡青
  { bg: "#fcf2da", text: "#b8932e" },  // 淡金
  { bg: "#e8eef5", text: "#4a658a" }   // 淡灰蓝
];

function nameHash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) & 0x7fffffff; }
  return h;
}

function getAvatarStyle(s) {
  // s 可以是学生对象（有 .name 和可选的 .colorIdx）或纯字符串名字
  var name = typeof s === 'string' ? s : s.name;
  var idx = (typeof s === 'object' && s != null && s.colorIdx != null)
    ? s.colorIdx
    : nameHash(name) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[idx % AVATAR_PALETTE.length];
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

// ---- Map Avatar Marker ----
// student：学生对象（读取 .name / .colorIdx）；selected：是否高亮深绿
function createAvatarIcon(student, selected) {
  var name = typeof student === 'string' ? student : student.name;
  var style = selected ? { bg: '#3a8f2e', text: '#ffffff' } : getAvatarStyle(student);
  var len = name.length;
  var fontSize = len <= 2 ? 15 : len <= 3 ? 13 : 12;
  var width = Math.max(40, len * 14 + 18);
  var shadow = selected
    ? '0 0 0 3px #6abf5c, 0 2px 10px rgba(58,143,46,0.45)'
    : '0 2px 8px rgba(0,0,0,0.18)';
  var html = '<div style="height:40px;width:' + width + 'px;border-radius:20px;background:' + style.bg + ';color:' + style.text + ';display:flex;align-items:center;justify-content:center;font-size:' + fontSize + 'px;font-weight:600;box-shadow:' + shadow + ';border:2px solid #fff;white-space:nowrap;padding:0 8px;">' + esc(name) + '</div>';
  return L.divIcon({
    className: 'avatar-marker',
    html: html,
    iconSize: [width, 40],
    iconAnchor: [width / 2, 20],
    popupAnchor: [0, -24]
  });
}

// ---- Feature 1: 头像点击随机换色 ----
function changeAvatarColor(idx, event) {
  event.stopPropagation(); // 不触发卡片点击
  var s = students[idx];
  var current = (s.colorIdx != null) ? s.colorIdx : nameHash(s.name) % AVATAR_PALETTE.length;
  var newIdx;
  do {
    newIdx = Math.floor(Math.random() * AVATAR_PALETTE.length);
  } while (newIdx === current && AVATAR_PALETTE.length > 1);
  students[idx].colorIdx = newIdx;
  save();
  renderList();
  refreshMap(true);
}

// ---- Feature 1: 卡片点击 → 单选 + 深绿高亮 + 地图定位 ----
function focusAndHighlight(idx) {
  var s = students[idx];
  if (selectedIds.has(s.id)) {
    // 再次点击取消选中
    selectedIds.clear();
  } else {
    selectedIds.clear();
    selectedIds.add(s.id);
    if (s.lat != null) map.setView([s.lat, s.lng], Math.max(map.getZoom(), 6), { animate: true });
  }
  renderList();
  refreshMap(true);
}

  navigator.clipboard.writeText(coord).then(function() {
    var btn = document.getElementById(btnId);

    setTimeout(function() {
      var b = document.getElementById(btnId);

    }, 1800);
  }).catch(function() {
    showToast('复制失败，请手动复制: ' + coord);
  });

function updateCoordPaste(idx, val) {
  // 支持格式：纬度, 经度 / 纬度,经度 / 纬度 经度（中英文逗号/空格均可）
  var parts = val.trim().split(/[\s,，]+/);
  if (parts.length < 2) { showToast('格式错误，请输入：纬度, 经度'); return; }
  var lat = parseFloat(parts[0]);
  var lng = parseFloat(parts[1]);
  if (isNaN(lat) || isNaN(lng)) { showToast('坐标格式错误，示例：38.040600, 114.510000'); return; }
  students[idx].lat = lat;
  students[idx].lng = lng;
  save();
  refreshMap(true);
  showToast('坐标已更新 ✓');
}

// ---- Map ----
var CHINA_BOUNDS = L.latLngBounds(L.latLng(15.0, 70.0), L.latLng(55.0, 140.0));

function initMap() {
  map = L.map("map", {
    zoomControl: true,
    maxBounds: CHINA_BOUNDS,
    maxBoundsViscosity: 0.8,
    minZoom: 3,
    zoomSnap: 0.15,    // 允许细粒度缩放吸附
    zoomDelta: 0.15    // 每次点击 +/- 缩放 0.15 级
  }).setView([35.8617, 104.1954], 4);

  // CartoDB 无标签底图：干净白底，配合省份GeoJSON呈现纯粹省级行政区
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // 防止拖出中国范围
  map.on('drag', function() {
    map.panInsideBounds(CHINA_BOUNDS, { animate: false });
  });

  markersLayer = L.layerGroup().addTo(map);

  // 缩放结束后重新布局头像（zoom-adaptive calcOffset 需要当前 zoom）
  map.on('zoomend', function() { refreshMap(true); });

  // 加载中国省级行政区GeoJSON
  initProvinceLayer();

  setTimeout(function(){ map.invalidateSize(); }, 100);
}

// 加载并渲染中国省份GeoJSON（DataV · 阿里云）
function initProvinceLayer() {
  // 中国境外区域灰色遮罩（先加入叠加层，位于省份填色之下）
  L.geoJSON({
    type: 'Feature',
    geometry: {
      type: 'Polygon',
      coordinates: [[[-180,-90],[180,-90],[180,90],[-180,90],[-180,-90]]]
    }
  }, {
    style: { fillColor: '#cdd4dc', fillOpacity: 0.60, color: 'none', weight: 0 },
    interactive: false
  }).addTo(map);

  fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      cachedProvinceData = data; // 缓存供南海副图使用

      // 为每个省分配颜色
      var colorIdx = 0;
      data.features.forEach(function(f) {
        var shortName = getProvinceShortName(f.properties.name);
        if (!provinceColorMap[shortName]) {
          provinceColorMap[shortName] = PROVINCE_FILL_COLORS[colorIdx % PROVINCE_FILL_COLORS.length];
          colorIdx++;
        }
      });

      // 省份填色（添加在遮罩之后，自动覆盖中国区域）
      provinceGeoLayer = L.geoJSON(data, {
        style: function(feature) {
          var shortName = getProvinceShortName(feature.properties.name);
          return {
            fillColor: provinceColorMap[shortName] || '#c8d5b9',
            fillOpacity: 0.55,
            color: '#ffffff',
            weight: 1.5
          };
        },
        onEachFeature: function(feature, layer) {
          var shortName = getProvinceShortName(feature.properties.name);
          // 甘肃/河北形状特殊，自动中心点位置不准，单独处理
          if (shortName === '甘肃' || shortName === '河北') return;
          layer.bindTooltip(shortName, {
            permanent: true,
            direction: 'center',
            className: 'province-label'
          });
        }
      }).addTo(map);

      // 甘肃省标签固定在张掖附近
      L.marker([38.93, 100.45], {
        icon: L.divIcon({
          className: 'province-label',
          html: '甘肃',
          iconSize: [40, 16],
          iconAnchor: [20, 8]
        }),
        interactive: false,
        keyboard: false
      }).addTo(map);

      // 河北省标签固定在石家庄附近
      L.marker([38.04, 114.51], {
        icon: L.divIcon({
          className: 'province-label',
          html: '河北',
          iconSize: [40, 16],
          iconAnchor: [20, 8]
        }),
        interactive: false,
        keyboard: false
      }).addTo(map);

      // 初始化南海诸岛副图
      initSCSInset(data);
    })
    .catch(function(err) {
      console.warn('省份GeoJSON加载失败，请检查网络连接', err);
    });
}

// 同省多人：环形排列，半径随缩放级别自适应
// 缩放越大 → 像素/度越大 → 使用更小的度半径即可保证头像不重叠
function calcOffset(lat, lng, idx, total) {
  if (total === 1) return [lat, lng];
  var zoom = map ? map.getZoom() : 4;
  // 每度对应的像素数（纬度方向）
  var pxPerDeg = 256 * Math.pow(2, zoom) / 360;
  // 头像高36px，额外留12px间距 → 需要48px中心距
  var rDeg = 48 / pxPerDeg;
  // 最小0.25°（避免太近看不出分布），最大0.85°（避免跑出省界）
  var r = Math.min(Math.max(rDeg, 0.25), 0.85);
  var angle = (idx / total) * 2 * Math.PI - Math.PI / 2;
  return [lat + Math.sin(angle) * r * 0.82, lng + Math.cos(angle) * r];
}

// 南海诸岛副图（右下角小地图，复用主图省份数据）
function initSCSInset(geoData) {
  var el = document.getElementById('scs-map');
  if (!el) return;

  var scsMap = L.map('scs-map', {
    attributionControl: false, zoomControl: false,
    dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, touchZoom: false, keyboard: false
  }).setView([13, 116], 3);

  // 同款底图
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19
  }).addTo(scsMap);

  // 境外遮罩
  L.geoJSON({
    type: 'Feature',
    geometry: { type: 'Polygon', coordinates: [[[-180,-90],[180,-90],[180,90],[-180,90],[-180,-90]]] }
  }, {
    style: { fillColor: '#cdd4dc', fillOpacity: 0.60, color: 'none', weight: 0 },
    interactive: false
  }).addTo(scsMap);

  // 省份填色（复用主图颜色）
  if (geoData) {
    L.geoJSON(geoData, {
      style: function(feature) {
        var shortName = getProvinceShortName(feature.properties.name);
        return {
          fillColor: provinceColorMap[shortName] || '#c8d5b9',
          fillOpacity: 0.55, color: '#ffffff', weight: 0.8
        };
      }
    }).addTo(scsMap);
  }
}

function refreshMap(noFit) {
  markersLayer.clearLayers();
  var bounds = [];

  // 按省份分组
  var provinceGroups = {};
  students.forEach(function(s) {
    if (s.lat == null || s.lng == null) return;
    var key = s.province || (s.lat.toFixed(4) + ',' + s.lng.toFixed(4));
    if (!provinceGroups[key]) {
      provinceGroups[key] = { lat: s.lat, lng: s.lng, students: [] };
    }
    provinceGroups[key].students.push(s);
  });

  // 每省多人时网格错位，各自独立头像
  Object.keys(provinceGroups).forEach(function(provKey) {
    var group = provinceGroups[provKey];
    var baseLat = group.lat, baseLng = group.lng;
    var sList = group.students;

    // 按学校排序，相同学校相邻
    sList.sort(function(a, b) { return a.school.localeCompare(b.school, 'zh'); });

    sList.forEach(function(s, idx) {
      var pos = calcOffset(baseLat, baseLng, idx, sList.length);
      var icon = createAvatarIcon(s, selectedIds.has(s.id));
      var m = L.marker(pos, { icon: icon }).addTo(markersLayer);

      // 每人独立弹窗（弹窗头像颜色与当前自定义色同步）
      var av = getAvatarStyle(s);
      var popupHtml =
        '<div class="popup-inner">' +
          '<div class="popup-single">' +
            '<div class="popup-single-avatar" style="background:' + av.bg + ';color:' + av.text + '">' + esc(getInitial(s.name)) + '</div>' +
            '<div class="popup-single-name">' + esc(s.name) + '</div>' +
            '<div class="popup-single-school">' + esc(s.school) + '</div>' +
            (s.province ? '<div class="popup-single-province">📍 ' + esc(s.province) + '</div>' : '') +
          '</div>' +
        '</div>';

      m.bindPopup(popupHtml, { maxWidth: 220, minWidth: 140 });
      m.on('mouseover', function() { this.openPopup(); });
      m.on('mouseout',  function() { this.closePopup(); });
      m._studentIds = [s.id];
      bounds.push(pos);
    });
  });

  // 图例
  var provinceCount = Object.keys(provinceGroups).length;
  $("legendCount").textContent = provinceCount;
  $("mapLegend").style.display = students.length > 0 ? "block" : "none";

  if (bounds.length === 0) {
    if (!noFit) map.setView([35.8617, 104.1954], 4);
  } else if (bounds.length === 1) {
    if (!noFit) map.setView(bounds[0], 6);
  } else {
    if (!noFit) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 8 });
  }
  setTimeout(function(){ map.invalidateSize(); }, 50);
}

// ---- Sidebar ----

      (students.length > 0 ? '<button class="btn-clear" onclick="clearAll()">清空</button>' : '') +
    '</div></div>';

  if (students.length === 0) {
    html += '<div class="empty-hint">还没有录入好友<br>在上方添加第一个好友吧</div>';
  } else {
    students.forEach(function(s, i) {
      var av = getAvatarStyle(s);
      var isSel = selectedIds.has(s.id);

      var avatarText = isSel ? '#fff' : av.text;
      // 管理员模式：编辑简介和坐标
      var adminRow = '';
      if (adminMode) {
        adminRow =
          '<div class="admin-coord-row" onclick="event.stopPropagation()">' +
            '<span class="admin-coord-label">简介:</span>' +
            '<input class="admin-coord-input" type="text" style="width:110px" ' +
              'value="' + esc(s.school) + '" placeholder="学校/简介" ' +
              'onchange="updateSchool(' + i + ', this.value)">' +
          '</div>' +
          '<div class="admin-coord-row" onclick="event.stopPropagation()">' +
            '<span class="admin-coord-label">坐标:</span>' +
            '<input class="admin-coord-input" type="text" style="width:110px" ' +
              'value="' + ((s.lat != null && s.lng != null) ? s.lat.toFixed(6) + ', ' + s.lng.toFixed(6) : '') + '" placeholder="纬度, 经度" ' +
              'onchange="updateCoordPaste(' + i + ', this.value)">' +
          '</div>';
      }
      html +=
        '<div class="student-card' + (isSel ? ' selected' : '') + '" data-idx="' + i + '" onclick="focusAndHighlight(' + i + ')">' +
          '<div class="student-avatar" style="background:' + avatarBg + ';color:' + avatarText + ';cursor:pointer" ' +
            'onclick="changeAvatarColor(' + i + ', event)" title="点击随机换色">' +
            esc(getInitial(s.name)) +
          '</div>' +
          '<div class="student-info">' +
            '<div class="student-name">' + esc(s.name) + '</div>' +
            '<div class="student-school">' + esc(s.school) + '</div>' +
            '<div class="student-province">' + esc(s.province || '') + '</div>' +
            adminRow +
          '</div>' +
          '<button class="btn-del" onclick="event.stopPropagation();deleteStudent(' + i + ')" title="删除">&times;</button>' +
        '</div>';
    });
  }
  $("studentList").innerHTML = html;
}

function focusStudent(idx) {
  var s = students[idx];
  if (s.lat == null || s.lng == null) { showToast("该省份暂无法定位"); return; }
  map.setView([s.lat, s.lng], 7, { animate: true });
  setTimeout(function() {
    markersLayer.eachLayer(function(layer) {
      if (layer._studentIds && layer._studentIds.indexOf(s.id) !== -1) {
        layer.openPopup();
      }
    });
  }, 400);
}

function deleteStudent(idx) {
  if (!confirm("确认删除 " + students[idx].name + " 的信息？")) return;
  students.splice(idx, 1);
  save();
  renderList();
  refreshMap();
  showToast("已删除");
}

function clearAll() {
  if (!confirm("确认清空全部 " + students.length + " 位同学的信息？此操作不可恢复。")) return;
  students = [];
  save();
  renderList();
  refreshMap();
  showToast("已全部清空");
}

// ---- Batch Import ----
async function batchImport() {
  var raw = $("batchText").value.trim();
  if (!raw) { showToast("请粘贴同学信息"); return; }

  var lines = raw.split(/[\n\r]+/).filter(function(l){ return l.trim(); });
  var newItems = [];
  var errors = [];

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    // try tab, comma, or multiple spaces as separator
    var parts = null;
    if (line.indexOf("\t") > -1) parts = line.split("\t");
    else if (line.indexOf(",") > -1) parts = line.split(",");
    else parts = line.split(/\s{2,}/);
    if (parts.length < 2) parts = line.split(/\s+/);

    var name = (parts[0]||"").trim();
    var school = (parts[1]||"").trim();
    var province = (parts[2]||"").trim();

    if (!name || !school || !province) {
      errors.push("第" + (i+1) + "行格式不正确: " + line.substring(0,30));
      continue;
    }

    var stdProvince = resolveProvince(province);
    if (!stdProvince) {
      errors.push("第" + (i+1) + "行省份无法识别: " + province);
      continue;
    }

    var exists = students.some(function(s){ return s.name === name && s.province === stdProvince; });
    if (exists) { errors.push(name + " 已存在（" + stdProvince + "），跳过"); continue; }

    var coords = PROVINCE_COORDS[stdProvince];
    if (!coords) {
      errors.push(stdProvince + " 坐标未找到: " + name);
      continue;
    }
    newItems.push({ id: Date.now() + i, name: name, school: school, province: stdProvince, lat: coords[0], lng: coords[1] });
  }

  if (newItems.length === 0) {
    showToast("未能导入任何数据，" + errors.length + " 条出错");
    return;
  }

  students = students.concat(newItems);
  save(); renderList(); refreshMap();
  $("batchText").value = "";

  var msg = "成功播种 " + newItems.length + " 个好友！";
  if (errors.length > 0) msg += " " + errors.length + " 条跳过。";
  showToast(msg);
}

// ---- Fullscreen ----
function toggleFullscreen() {
  var isFS = document.body.classList.toggle('is-fullscreen');
  // 切换图标：展开 ↔ 收缩
  var iconPath = isFS
    ? 'M8 3H3v5M17 3h-5v5M12 17h5v-5M3 12v5h5'   // 收缩图标
    : 'M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4';   // 展开图标
  document.getElementById('fsIcon').querySelector('path').setAttribute('d', iconPath);
  // 通知 Leaflet 重新计算尺寸
  setTimeout(function() {
    if (map) map.invalidateSize();
  }, 50);
}

// ---- Init ----
function init() {
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { students = JSON.parse(saved); } catch(e) { students = []; }
  }

  initMap();
  renderList();
  refreshMap();

  $("btnImport").addEventListener("click", batchImport);
  $("btnFullscreen").addEventListener("click", toggleFullscreen);
  $("logoBtn").addEventListener("click", handleLogoClick);
}

document.addEventListener("DOMContentLoaded", init);
</script>
